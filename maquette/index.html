<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fin'Elle – Maquette</title>
<style>
/* =========================================================
   Charte – valeurs indicatives, à remplacer par la charte
   officielle Fin'Elle / Cofina (seules ces variables changent).
   ========================================================= */
:root {
  --accent: #D6336C;
  --accent-hover: #BE2A5E;
  --accent-soft: #FCE8EF;
  --accent-ring: rgba(214, 51, 108, .28);

  --bg: #FFFFFF;
  --surface: #F5F6F8;
  --surface-2: #ECEEF1;
  --border: #E1E4E8;
  --text: #2F3437;
  --text-muted: #6B7178;

  --success: #2F9E62;  --success-soft: #E6F4EC;
  --warning: #C77700;  --warning-soft: #FFF3DF;
  --danger:  #C92A2A;  --danger-soft:  #FDE8E8;
  --info:    #2C6DB5;  --info-soft:    #E7F0FA;

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow: 0 2px 8px rgba(16, 24, 40, .07);
  --shadow-hover: 0 8px 20px rgba(16, 24, 40, .10);

  --ease: cubic-bezier(.2, .7, .3, 1);
  --t-fast: 140ms;
  --t: 200ms;

  --sidebar-w: 248px;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: 22px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
.muted { color: var(--text-muted); }
.hidden { display: none !important; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease), color var(--t) var(--ease), border-color var(--t) var(--ease);
}
.btn:focus-visible, .input:focus-visible, .nav-item:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 14px var(--accent-ring); }
.btn-primary:active { transform: translateY(0); box-shadow: var(--shadow-sm); }
.btn-ghost { background: var(--bg); color: var(--text); border-color: var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.btn-ghost:active { transform: translateY(0); }
.btn .i { transition: transform var(--t) var(--ease); }
.btn:hover .i-arrow { transform: translateX(3px); }
.btn:hover .i-plus { transform: rotate(90deg); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center;
  border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; color: var(--text-muted); cursor: pointer;
  transition: background var(--t) var(--ease), color var(--t) var(--ease);
}
.icon-btn:hover { background: var(--surface); color: var(--accent); }

/* ---------- Champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 13px; }
.input, select.input, textarea.input {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.input:hover { border-color: #C5CAD1; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.field-error { color: var(--danger); font-size: 12.5px; min-height: 18px; }
.input.invalid { border-color: var(--danger); }

/* ---------- Badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-accent  { background: var(--accent-soft);  color: var(--accent); }
.b-success { background: var(--success-soft); color: var(--success); }
.b-warning { background: var(--warning-soft); color: var(--warning); }
.b-danger  { background: var(--danger-soft);  color: var(--danger); }
.b-info    { background: var(--info-soft);    color: var(--info); }
.b-neutral { background: var(--surface-2);    color: var(--text-muted); }

/* ---------- Cartes ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow-sm);
  transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease), border-color var(--t) var(--ease);
}
.card-hover:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: #D3D7DD; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }

/* ---------- Connexion ---------- */
.login {
  min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(1000px 500px at 85% -10%, var(--accent-soft), transparent 60%), var(--bg);
}
.login-card { width: 100%; max-width: 420px; background: var(--bg); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); animation: rise .45s var(--ease) both; }
.login-card form { display: grid; gap: 12px; margin-top: 24px; }
.login-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start; }
.login-foot .i { width: 16px; height: 16px; color: var(--accent); margin-top: 2px; }

/* ---------- Logo ---------- */
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 15px;
  transition: transform var(--t) var(--ease);
}
.logo:hover .logo-mark { transform: rotate(-6deg) scale(1.05); }
.logo small { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: .02em; }

/* ---------- Layout appli ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100%; }
.sidebar {
  position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--border); background: var(--bg);
  display: flex; flex-direction: column; padding: 18px 14px; gap: 22px; z-index: 30;
}
.nav { display: grid; gap: 2px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); padding: 10px 12px 6px; font-weight: 600; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 12px;
  border-radius: var(--radius-sm); color: var(--text); font-weight: 500;
  transition: background var(--t) var(--ease), color var(--t) var(--ease);
}
.nav-item::before {
  content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0;
  background: var(--accent); transform: scaleY(0); transition: transform var(--t) var(--ease);
}
.nav-item .i { color: var(--text-muted); transition: transform var(--t) var(--ease), color var(--t) var(--ease); }
.nav-item:hover { background: var(--surface); }
.nav-item:hover .i { transform: translateX(2px); color: var(--accent); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item.active .i { color: var(--accent); }
.nav-item.active::before { transform: scaleY(1); }
.nav-item .count { margin-left: auto; font-size: 11.5px; background: var(--accent); color: #fff; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
.sidebar-foot { margin-top: auto; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12.5px;
}
.user-chip .meta { min-width: 0; flex: 1; }
.user-chip .meta b, .user-chip .meta span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-chip .meta span { font-size: 12px; color: var(--text-muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 12px 28px; background: rgba(255, 255, 255, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
.topbar .search { position: relative; flex: 1; max-width: 420px; }
.topbar .search .i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 16px; height: 16px; }
.topbar .search .input { padding-left: 34px; background: var(--surface); border-color: transparent; }
.topbar .search .input:focus { background: var(--bg); }
.topbar .spacer { flex: 1; }
.notif { position: relative; }
.notif .dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
.notif:hover .i { animation: ring .5s var(--ease); }
.menu-toggle { display: none; }

.content { padding: 28px; display: grid; gap: 24px; max-width: 1280px; width: 100%; animation: fade .3s var(--ease) both; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; }
.crumbs { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
.crumbs a { color: var(--text-muted); transition: color var(--t) var(--ease); }
.crumbs a:hover { color: var(--accent); }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { display: grid; gap: 6px; }
.kpi .kpi-top { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 13px; font-weight: 500; }
.kpi .kpi-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); color: var(--accent); border: 1px solid var(--border); transition: transform var(--t) var(--ease), background var(--t) var(--ease), color var(--t) var(--ease); }
.kpi:hover .kpi-ico { transform: scale(1.08); background: var(--accent); color: #fff; border-color: var(--accent); }
.kpi .kpi-val { font-size: 24px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.kpi .kpi-delta { font-size: 12.5px; }
.up { color: var(--success); } .down { color: var(--danger); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
.grid-2-even { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-2 > *, .grid-2-even > *, .kpis > * { min-width: 0; }

/* ---------- Tableaux ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); -webkit-overflow-scrolling: touch; }
.card .table-wrap { margin: 0 -1px -1px; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th, td { text-align: left; padding: 12px 16px; white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; background: var(--surface); border-bottom: 1px solid var(--border); }
td { border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background var(--t-fast) var(--ease); }
tbody tr.clickable { cursor: pointer; }
tbody tr:hover { background: #FAFBFC; }
tbody tr.clickable td:first-child { box-shadow: inset 0 0 0 var(--accent); transition: box-shadow var(--t) var(--ease); }
tbody tr.clickable:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tbody tr .row-go { opacity: 0; transform: translateX(-4px); transition: opacity var(--t) var(--ease), transform var(--t) var(--ease); color: var(--accent); }
tbody tr:hover .row-go { opacity: 1; transform: translateX(0); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.ref { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; color: var(--text-muted); }
.who { display: flex; align-items: center; gap: 10px; }
.who .avatar { width: 30px; height: 30px; font-size: 11.5px; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .input { width: auto; min-width: 180px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font: inherit; font-size: 13px; color: var(--text);
  transition: border-color var(--t) var(--ease), color var(--t) var(--ease), background var(--t) var(--ease);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- Étapes ---------- */
.stepper { display: flex; gap: 0; counter-reset: s; overflow-x: auto; padding-bottom: 4px; }
.step { flex: 1; min-width: 120px; position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; font-size: 12.5px; color: var(--text-muted); }
.step::after { content: ""; position: absolute; top: 15px; left: calc(50% + 20px); right: calc(-50% + 20px); height: 2px; background: var(--border); border-radius: 2px; }
.step:last-child::after { display: none; }
.step.done::after { background: var(--accent); }
.step .dotnum {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: var(--bg); border: 2px solid var(--border); color: var(--text-muted); position: relative; z-index: 1;
  transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.step:hover .dotnum { transform: scale(1.08); }
.step.done .dotnum { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.active { color: var(--text); font-weight: 600; }
.step.active .dotnum { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); animation: pulse 2.4s var(--ease) infinite; }
.step .dotnum .i { width: 15px; height: 15px; stroke-width: 2.5; }

/* ---------- Divers ---------- */
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.kv div span { display: block; font-size: 12px; color: var(--text-muted); }
.kv div b { font-weight: 600; }
.list { display: grid; gap: 4px; }
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-sm);
  transition: background var(--t) var(--ease);
}
.list-item:hover { background: var(--bg); }
.list-item .doc-ico { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); transition: color var(--t) var(--ease), border-color var(--t) var(--ease); }
.list-item:hover .doc-ico { color: var(--accent); border-color: var(--accent); }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .grow b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .grow span { font-size: 12px; color: var(--text-muted); }

.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 18px 1fr; gap: 12px; position: relative; padding-bottom: 16px; }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--border); }
.tl:last-child::before { display: none; }
.tl .pt { width: 12px; height: 12px; margin: 4px 3px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); transition: transform var(--t) var(--ease), background var(--t) var(--ease); }
.tl:hover .pt { transform: scale(1.25); background: var(--accent); }
.tl small { color: var(--text-muted); display: block; }

.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.bar-row .bar-track { grid-column: 1 / -1; }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transform-origin: left; animation: grow .8s var(--ease) both; transition: filter var(--t) var(--ease); }
.bar-row:hover .bar-fill { filter: brightness(1.12); }
.bar-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); }

.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.check { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.check .i { width: 14px; height: 14px; stroke-width: 2.6; }
.nope { color: #C5CAD1; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.upload {
  border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 22px; text-align: center; background: var(--bg); color: var(--text-muted); cursor: pointer;
  transition: border-color var(--t) var(--ease), background var(--t) var(--ease), color var(--t) var(--ease);
}
.upload:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.upload .i { width: 26px; height: 26px; margin-bottom: 6px; transition: transform var(--t) var(--ease); }
.upload:hover .i { transform: translateY(-3px); }
.form-actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.denied { text-align: center; padding: 56px 20px; display: grid; gap: 10px; justify-items: center; }
.denied .big { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.denied .big .i { width: 26px; height: 26px; }

.toast {
  position: fixed; right: 20px; bottom: 20px; z-index: 100; display: flex; gap: 10px; align-items: center;
  background: var(--text); color: #fff; padding: 12px 16px; border-radius: var(--radius); box-shadow: var(--shadow-hover);
  transform: translateY(16px); opacity: 0; pointer-events: none; transition: transform var(--t) var(--ease), opacity var(--t) var(--ease);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast .i { color: #7BE0A6; }

.demo-banner { background: var(--accent-soft); color: var(--accent); font-size: 12.5px; text-align: center; padding: 6px 12px; font-weight: 600; }
.backdrop { display: none; }

/* ---------- Animations ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 5px var(--accent-soft); } 50% { box-shadow: 0 0 0 8px rgba(252, 232, 239, .55); } }
@keyframes ring { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(12deg); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(5deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- Responsive : ordinateur d'abord ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; transform: translateX(-100%); transition: transform var(--t) var(--ease); box-shadow: var(--shadow-hover); }
  .app.nav-open .sidebar { transform: none; }
  .app.nav-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(16, 24, 40, .35); z-index: 25; animation: fade .2s both; }
  .menu-toggle { display: inline-grid; }
  .topbar { padding: 10px 16px; }
  .content { padding: 20px 16px; }
  .grid-2-even, .form-grid, .kv { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: 1fr; }
  .topbar .search { display: none; }
  .toolbar .input { min-width: 0; flex: 1; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>

<div class="demo-banner">Maquette – données fictives uniquement</div>

<!-- ================= Connexion ================= -->
<section id="login" class="login">
  <div class="login-card">
    <div class="logo"><div class="logo-mark">F</div><div>Fin'Elle<small>par Cofina</small></div></div>
    <h1 style="margin-top:24px">Connexion</h1>
    <p class="muted" style="margin:4px 0 0">Accès réservé aux collaborateurs.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">E-mail professionnel</label>

<script>
/* =========================================================
   Configuration
   ========================================================= */
// Domaine e-mail autorisé – à remplacer par le domaine réel de l'entreprise.
const ALLOWED_DOMAIN = 'cofina-demo.com';

// Droits par rôle : chaque écran déclare la permission requise.
const ROLES = {
  agent:   { label: "Chargée de clientèle", perms: ['dashboard', 'dossiers', 'nouveau'] },
  analyste:{ label: "Analyste crédit",      perms: ['dashboard', 'dossiers', 'decider'] },
  comite:  { label: "Membre du comité",     perms: ['dashboard', 'dossiers', 'decider', 'audit'] },
  admin:   { label: "Administrateur",       perms: ['dashboard', 'dossiers', 'nouveau', 'decider', 'utilisateurs', 'audit'] },
};
const PERM_LABELS = {
  dashboard: 'Tableau de bord', dossiers: 'Consulter les dossiers', nouveau: 'Créer une demande',
  decider: 'Valider / rejeter', utilisateurs: 'Gérer les utilisateurs', audit: "Journal d'audit",
};

const STEPS = ['Demande', 'Vérification KYC', 'Analyse crédit', 'Comité', 'Décaissement'];
const STATUS = {
  brouillon: ['Brouillon', 'b-neutral'],
  kyc:       ['Vérification KYC', 'b-info'],
  analyse:   ['En analyse', 'b-accent'],
  comite:    ['En comité', 'b-warning'],
  approuve:  ['Approuvé', 'b-success'],
  rejete:    ['Rejeté', 'b-danger'],
};

/* =========================================================
   Données fictives
   ========================================================= */
const DOSSIERS = [
  { ref: 'FE-2026-0142', cliente: 'Aminata Koné',     entreprise: 'Atelier Wax & Co',      secteur: 'Couture',        ville: 'Abidjan',  montant: 7500000,  duree: 24, statut: 'analyse',  etape: 2, date: '2026-10-13T09:42', agent: 'Fatou Diallo' },
  { ref: 'FE-2026-0141', cliente: 'Mariam Traoré',    entreprise: 'Saveurs du Sahel',      secteur: 'Agroalimentaire', ville: 'Dakar',    montant: 12000000, duree: 36, statut: 'comite',   etape: 3, date: '2026-10-12T15:10', agent: 'Awa Ndiaye' },
  { ref: 'FE-2026-0139', cliente: 'Clarisse Yao',     entreprise: 'Yao Cosmétiques',       secteur: 'Cosmétique',     ville: 'Bouaké',   montant: 4200000,  duree: 18, statut: 'kyc',      etape: 1, date: '2026-10-11T11:05', agent: 'Fatou Diallo' },
  { ref: 'FE-2026-0137', cliente: 'Ndeye Sarr',       entreprise: 'Sarr Transport',        secteur: 'Logistique',     ville: 'Thiès',    montant: 25000000, duree: 48, statut: 'approuve', etape: 4, date: '2026-10-09T08:30', agent: 'Awa Ndiaye' },
  { ref: 'FE-2026-0134', cliente: 'Rokia Coulibaly',  entreprise: 'Boulangerie Le Fournil',secteur: 'Agroalimentaire', ville: 'Bamako',   montant: 9800000,  duree: 30, statut: 'approuve', etape: 5, date: '2026-10-06T16:45', agent: 'Fatou Diallo' },
  { ref: 'FE-2026-0131', cliente: 'Grâce Mensah',     entreprise: 'Mensah Digital',        secteur: 'Services',       ville: 'Lomé',     montant: 3500000,  duree: 12, statut: 'rejete',   etape: 3, date: '2026-10-03T10:20', agent: 'Awa Ndiaye' },
  { ref: 'FE-2026-0128', cliente: 'Adjoa Kouassi',    entreprise: 'Pharmacie Bel Air',     secteur: 'Santé',          ville: 'Abidjan',  montant: 18500000, duree: 36, statut: 'analyse',  etape: 2, date: '2026-10-02T14:00', agent: 'Fatou Diallo' },
  { ref: 'FE-2026-0125', cliente: 'Khady Fall',       entreprise: 'Fall Agro',             secteur: 'Agriculture',    ville: 'Saint-Louis', montant: 6000000, duree: 24, statut: 'brouillon', etape: 0, date: '2026-09-30T09:15', agent: 'Awa Ndiaye' },
];

const USERS = [
  { nom: 'Fatou Diallo',   email: 'fatou.diallo@',   role: 'agent',    actif: true,  derniere: '2026-10-14T08:12' },
  { nom: 'Awa Ndiaye',     email: 'awa.ndiaye@',     role: 'agent',    actif: true,  derniere: '2026-10-13T17:40' },
  { nom: 'Ibrahim Touré',  email: 'ibrahim.toure@',  role: 'analyste', actif: true,  derniere: '2026-10-14T09:03' },
  { nom: 'Mireille Gbagbo',email: 'mireille.gbagbo@',role: 'comite',   actif: true,  derniere: '2026-10-12T11:22' },
  { nom: 'Serge Kouadio',  email: 'serge.kouadio@',  role: 'admin',    actif: true,  derniere: '2026-10-14T07:55' },
  { nom: 'Binta Sow',      email: 'binta.sow@',      role: 'analyste', actif: false, derniere: '2026-08-28T16:30' },
];

let AUDIT = [
  { at: '2026-10-14T09:03', user: 'ibrahim.toure', action: 'Consultation', cible: 'FE-2026-0142', ip: '10.0.4.21' },
  { at: '2026-10-14T08:12', user: 'fatou.diallo',  action: 'Connexion',    cible: '—',            ip: '10.0.2.8' },
  { at: '2026-10-14T07:55', user: 'serge.kouadio', action: 'Modification de rôle', cible: 'binta.sow', ip: '10.0.1.3' },
  { at: '2026-10-13T17:40', user: 'awa.ndiaye',    action: 'Pièce ajoutée', cible: 'FE-2026-0141', ip: '10.0.2.14' },
  { at: '2026-10-13T16:02', user: 'mireille.gbagbo', action: 'Avis comité', cible: 'FE-2026-0137', ip: '10.0.5.2' },
  { at: '2026-10-13T09:11', user: 'inconnu@gmail.com', action: 'Connexion refusée (domaine)', cible: '—', ip: '196.47.12.9' },
];

/* =========================================================
   Formats : FCFA, JJ/MM/AAAA, HH:MM
   ========================================================= */
const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
const fcfa = n => nf.format(n).replace(/ | /g, ' ') + ' FCFA';
const pad = n => String(n).padStart(2, '0');
const toDate = v => v instanceof Date ? v : new Date(v);
const fDate = v => { const d = toDate(v); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fTime = v => { const d = toDate(v); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fDateTime = v => `${fDate(v)} ${fTime(v)}`;
const initials = name => name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (id, cls = '') => `<svg class="i ${cls}"><use href="#ic-${id}"/></svg>`;
const badge = s => `<span class="badge ${STATUS[s][1]}">${STATUS[s][0]}</span>`;

/* =========================================================
   Session & audit
   ========================================================= */
let session = null;

function audit(action, cible = '—') {
  if (!session) return;
  AUDIT.unshift({ at: new Date().toISOString(), user: session.email.split('@')[0], action, cible, ip: '10.0.3.17' });
}
const can = perm => session && ROLES[session.role].perms.includes(perm);

/* =========================================================
   Connexion
   ========================================================= */
const $ = s => document.querySelector(s);
$('#domainLabel').textContent = '@' + ALLOWED_DOMAIN;
$('#role').innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}">${r.label}</option>`).join('');

$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const email = $('#email').value.trim().toLowerCase();
  const pwd = $('#pwd').value;
  const err = $('#loginError');
  $('#email').classList.remove('invalid');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Saisissez une adresse e-mail valide.'; $('#email').classList.add('invalid'); return; }
  if (email.split('@')[1] !== ALLOWED_DOMAIN) {
    err.textContent = `Accès refusé : seules les adresses @${ALLOWED_DOMAIN} sont autorisées.`;
    $('#email').classList.add('invalid');
    AUDIT.unshift({ at: new Date().toISOString(), user: email, action: 'Connexion refusée (domaine)', cible: '—', ip: '10.0.3.17' });
    return;
  }
  if (pwd.length < 8) { err.textContent = 'Mot de passe : 8 caractères minimum.'; return; }
  err.textContent = '';
  const local = email.split('@')[0];
  const name = local.split(/[._-]/).map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
  session = { email, name, role: $('#role').value };
  audit('Connexion');
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#meName').textContent = name;
  $('#meRole').textContent = ROLES[session.role].label;
  $('#meAvatar').textContent = initials(name);
  location.hash = '#/tableau-de-bord';
  render();
});

$('#logout').addEventListener('click', () => {
  audit('Déconnexion');
  session = null;
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#pwd').value = '';
  history.replaceState(null, '', location.pathname);
});

$('#menuToggle').addEventListener('click', () => $('#app').classList.toggle('nav-open'));
$('#backdrop').addEventListener('click', () => $('#app').classList.remove('nav-open'));
$('#today').textContent = fDateTime(new Date());

/* =========================================================
   Navigation
   ========================================================= */
const NAV = [
  { group: 'Pilotage' },
  { path: 'tableau-de-bord', label: 'Tableau de bord', icon: 'home',   perm: 'dashboard' },
  { path: 'dossiers',        label: 'Dossiers',        icon: 'folder', perm: 'dossiers', count: () => DOSSIERS.filter(d => !['approuve', 'rejete'].includes(d.statut)).length },
  { path: 'nouvelle-demande',label: 'Nouvelle demande',icon: 'plus',   perm: 'nouveau' },
  { group: 'Administration' },
  { path: 'utilisateurs',    label: 'Utilisateurs & rôles', icon: 'users', perm: 'utilisateurs' },
  { path: 'audit',           label: "Journal d'audit", icon: 'log',    perm: 'audit' },
];

function renderNav(current) {
  const items = NAV.filter((n, i) => {
    if (!n.group) return can(n.perm);
    // n'affiche un groupe que s'il contient au moins un élément autorisé
    for (let j = i + 1; j < NAV.length && !NAV[j].group; j++) if (can(NAV[j].perm)) return true;
    return false;
  });
  $('#nav').innerHTML = items.map(n => n.group
    ? `<div class="nav-label">${n.group}</div>`
    : `<a class="nav-item ${current === n.path ? 'active' : ''}" href="#/${n.path}">${icon(n.icon)}<span>${n.label}</span>${n.count ? `<span class="count">${n.count()}</span>` : ''}</a>`
  ).join('');
}

const ROUTES = {
  'tableau-de-bord': { perm: 'dashboard', view: viewDashboard },
  'dossiers':        { perm: 'dossiers',  view: viewDossiers },
  'dossier':         { perm: 'dossiers',  view: viewDossier, nav: 'dossiers' },
  'nouvelle-demande':{ perm: 'nouveau',   view: viewNouvelle },
  'utilisateurs':    { perm: 'utilisateurs', view: viewUsers },
  'audit':           { perm: 'audit',     view: viewAudit },
};

function render() {
  if (!session) return;
  const [, path = 'tableau-de-bord', param] = location.hash.split('/');
  const route = ROUTES[path] || ROUTES['tableau-de-bord'];
  renderNav(route.nav || path);
  $('#app').classList.remove('nav-open');
  const view = $('#view');
  view.style.animation = 'none'; void view.offsetWidth; view.style.animation = '';
  view.innerHTML = can(route.perm) ? route.view(param) : viewDenied();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* =========================================================
   Écrans
   ========================================================= */
function pageHead(title, sub, actions = '', crumbs = '') {
  return `<div class="page-head"><div>${crumbs}<h1>${title}</h1>${sub ? `<p class="muted">${sub}</p>` : ''}</div><div class="toolbar">${actions}</div></div>`;
}

function dossierRows(list, compact = false) {
  return list.map(d => `
    <tr class="clickable" onclick="location.hash='#/dossier/${d.ref}'">
      <td><span class="ref">${d.ref}</span></td>
      <td><div class="who"><div class="avatar">${initials(d.cliente)}</div><div><b>${esc(d.cliente)}</b><div class="muted" style="font-size:12px">${esc(d.entreprise)}</div></div></div></td>
      ${compact ? '' : `<td>${esc(d.secteur)}</td>`}
      <td class="num"><b>${fcfa(d.montant)}</b></td>
      <td>${badge(d.statut)}</td>
      <td>${fDate(d.date)} <span class="muted">${fTime(d.date)}</span></td>
      <td>${icon('chevron', 'row-go')}</td>
    </tr>`).join('');
}
const dossierHead = (compact = false) => `<thead><tr><th>Référence</th><th>Cliente</th>${compact ? '' : '<th>Secteur</th>'}<th class="num">Montant</th><th>Statut</th><th>Mise à jour</th><th></th></tr></thead>`;

function viewDashboard() {
  const enCours = DOSSIERS.filter(d => !['approuve', 'rejete', 'brouillon'].includes(d.statut));
  const total = enCours.reduce((s, d) => s + d.montant, 0);
  const secteurs = {};
  DOSSIERS.forEach(d => secteurs[d.secteur] = (secteurs[d.secteur] || 0) + d.montant);
  const max = Math.max(...Object.values(secteurs));
  const kpi = (label, val, ic, delta, up) => `
    <div class="card card-hover kpi">
      <div class="kpi-top">${label}<span class="kpi-ico">${icon(ic)}</span></div>
      <div class="kpi-val">${val}</div>
      <div class="kpi-delta ${up ? 'up' : 'down'}">${delta} <span class="muted">vs mois dernier</span></div>
    </div>`;
  return `
    ${pageHead(`Bonjour, ${esc(session.name.split(' ')[0])}`, `Synthèse du programme Fin'Elle au ${fDate(new Date())}.`,
      can('nouveau') ? `<a class="btn btn-primary" href="#/nouvelle-demande">${icon('plus', 'i-plus')} Nouvelle demande</a>` : '')}
    <div class="kpis">
      ${kpi('Dossiers en cours', enCours.length, 'folder', '▲ +3', true)}
      ${kpi('Montant en instruction', fcfa(total), 'wallet', '▲ +12 %', true)}
      ${kpi("Taux d'approbation", '78 %', 'trend', '▲ +4 pts', true)}
      ${kpi('Délai moyen de décision', '9 jours', 'clock', '▼ −2 j', true)}
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-head"><h2>Dossiers récents</h2><a class="btn btn-ghost btn-sm" href="#/dossiers">Tout voir ${icon('arrow', 'i-arrow')}</a></div>
        <div class="table-wrap"><table>${dossierHead(true)}<tbody>${dossierRows(DOSSIERS.slice(0, 5), true)}</tbody></table></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Montants par secteur</h2></div>
        <div class="bars">
          ${Object.entries(secteurs).sort((a, b) => b[1] - a[1]).map(([s, v], i) => `
            <div class="bar-row"><span>${s}</span><span class="num">${nf.format(v / 1e6).replace(/\s/g, ' ')} M</span><div class="bar-track"><div class="bar-fill" style="width:${(v / max * 100).toFixed(1)}%;animation-delay:${i * 60}ms"></div></div></div>`).join('')}
        </div>
        <p class="muted" style="font-size:12px;margin:14px 0 0">Montants en millions de FCFA.</p>
      </div>
    </div>`;
}

let filtre = 'tous';
function viewDossiers() {
  const filters = [['tous', 'Tous'], ['kyc', 'KYC'], ['analyse', 'En analyse'], ['comite', 'En comité'], ['approuve', 'Approuvés'], ['rejete', 'Rejetés']];
  const list = filtre === 'tous' ? DOSSIERS : DOSSIERS.filter(d => d.statut === filtre);
  return `
    ${pageHead('Dossiers de financement', `${DOSSIERS.length} dossiers · ${fcfa(DOSSIERS.reduce((s, d) => s + d.montant, 0))} demandés`,
      `<button class="btn btn-ghost" onclick="toast('Export CSV généré (démo)'); audit('Export', 'Liste des dossiers')">${icon('download')} Exporter</button>` +
      (can('nouveau') ? `<a class="btn btn-primary" href="#/nouvelle-demande">${icon('plus', 'i-plus')} Nouvelle demande</a>` : ''))}
    <div class="chips">${filters.map(([k, l]) => `<button class="chip ${filtre === k ? 'on' : ''}" onclick="filtre='${k}';render()">${l}</button>`).join('')}</div>
    <div class="table-wrap"><table>${dossierHead()}<tbody>${list.length ? dossierRows(list) : `<tr><td colspan="7" class="muted" style="text-align:center;padding:32px">Aucun dossier pour ce filtre.</td></tr>`}</tbody></table></div>`;
}

function viewDossier(ref) {
  const d = DOSSIERS.find(x => x.ref === ref);
  if (!d) return pageHead('Dossier introuvable', '', `<a class="btn btn-ghost" href="#/dossiers">Retour</a>`);
  audit('Consultation', d.ref);
  const finished = d.statut === 'approuve' && d.etape === 5;
  const steps = STEPS.map((s, i) => {
    const state = i < d.etape || finished ? 'done' : i === d.etape && d.statut !== 'rejete' ? 'active' : '';
    return `<div class="step ${state}"><div class="dotnum">${state === 'done' ? icon('check') : i + 1}</div>${s}</div>`;
  }).join('');
  const mensualite = Math.round(d.montant * (0.012 / (1 - Math.pow(1.012, -d.duree))));
  const docs = [['Pièce d\'identité', 'CNI – recto/verso', 'b-success', 'Validé'], ['Registre du commerce', 'RCCM', 'b-success', 'Validé'], ['Relevés bancaires', '6 derniers mois', 'b-warning', 'À compléter'], ['Plan de financement', 'PDF · 420 Ko', 'b-info', 'Reçu']];
  const decide = can('decider') && ['analyse', 'comite'].includes(d.statut);
  return `
    ${pageHead(esc(d.entreprise), `${badge(d.statut)} <span class="ref" style="margin-left:8px">${d.ref}</span>`,
      decide ? `<button class="btn btn-ghost" onclick="decision('${d.ref}','rejete')">${icon('x')} Rejeter</button><button class="btn btn-primary" onclick="decision('${d.ref}','approuve')">${icon('check')} Valider l'étape</button>` : '',
      `<div class="crumbs"><a href="#/dossiers">Dossiers</a>${icon('chevron')}<span>${d.ref}</span></div>`)}
    <div class="card"><div class="stepper">${steps}</div></div>
    <div class="grid-2-even">
      <div class="card card-hover">
        <div class="card-head"><h2>Demande</h2></div>
        <div class="kv">
          <div><span>Montant demandé</span><b>${fcfa(d.montant)}</b></div>
          <div><span>Durée</span><b>${d.duree} mois</b></div>
          <div><span>Mensualité estimée</span><b>${fcfa(mensualite)}</b></div>
          <div><span>Secteur</span><b>${esc(d.secteur)}</b></div>
          <div><span>Déposé le</span><b>${fDateTime(d.date)}</b></div>
          <div><span>Chargée de clientèle</span><b>${esc(d.agent)}</b></div>
        </div>
      </div>
      <div class="card card-hover">
        <div class="card-head"><h2>Cliente</h2></div>
        <div class="kv">
          <div><span>Nom</span><b>${esc(d.cliente)}</b></div>
          <div><span>Ville</span><b>${esc(d.ville)}</b></div>
          <div><span>Téléphone</span><b>+225 07 00 00 00 00</b></div>
          <div><span>E-mail</span><b>cliente@exemple.test</b></div>
          <div><span>Ancienneté activité</span><b>4 ans</b></div>
          <div><span>Chiffre d'affaires annuel</span><b>${fcfa(d.montant * 3.2)}</b></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Pièces justificatives</h2>${can('nouveau') ? `<button class="btn btn-ghost btn-sm" onclick="toast('Pièce ajoutée (démo)'); audit('Pièce ajoutée', '${d.ref}')">${icon('upload')} Ajouter</button>` : ''}</div>
        <div class="list">${docs.map(([t, s, c, l]) => `<div class="list-item"><div class="doc-ico">${icon('file')}</div><div class="grow"><b>${t}</b><span>${s}</span></div><span class="badge ${c}">${l}</span></div>`).join('')}</div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Historique</h2></div>
        <div class="timeline">
          ${AUDIT.filter(a => a.cible === d.ref).slice(0, 3).concat([{ at: d.date, user: d.agent.toLowerCase().replace(' ', '.'), action: 'Dossier déposé' }]).map(a => `
            <div class="tl"><div class="pt"></div><div><b>${esc(a.action)}</b><small>${esc(a.user)} · ${fDateTime(a.at)}</small></div></div>`).join('')}
        </div>
      </div>
    </div>`;
}

let wizStep = 0;
function viewNouvelle() {
  const labels = ['Cliente', 'Entreprise', 'Financement', 'Pièces'];
  const panes = [
    `<div class="field"><label>Nom et prénom</label><input class="input" placeholder="Ex. Aïcha Bamba"></div>
     <div class="field"><label>Date de naissance</label><input class="input" placeholder="JJ/MM/AAAA" inputmode="numeric"></div>
     <div class="field"><label>Téléphone</label><input class="input" placeholder="+225 00 00 00 00 00"></div>
     <div class="field"><label>Pièce d'identité n°</label><input class="input" placeholder="CI000000000"></div>`,
    `<div class="field"><label>Raison sociale</label><input class="input" placeholder="Nom de l'entreprise"></div>
     <div class="field"><label>Secteur</label><select class="input"><option>Commerce</option><option>Agroalimentaire</option><option>Couture</option><option>Services</option><option>Agriculture</option></select></div>
     <div class="field"><label>Date de création</label><input class="input" placeholder="JJ/MM/AAAA"></div>
     <div class="field"><label>Chiffre d'affaires annuel (FCFA)</label><input class="input" placeholder="0" inputmode="numeric"></div>`,
    `<div class="field"><label>Montant demandé (FCFA)</label><input class="input" placeholder="Ex. 5 000 000" inputmode="numeric"></div>
     <div class="field"><label>Durée (mois)</label><select class="input"><option>12</option><option>18</option><option selected>24</option><option>36</option><option>48</option></select></div>
     <div class="field full"><label>Objet du financement</label><textarea class="input" rows="3" placeholder="Décrivez l'utilisation des fonds"></textarea></div>`,
    `<div class="full upload" onclick="toast('Fichier ajouté (démo)')">${icon('upload')}<div><b>Déposer les pièces justificatives</b></div><div style="font-size:12.5px">PDF, JPG ou PNG · 10 Mo max par fichier</div></div>`,
  ];
  return `
    ${pageHead('Nouvelle demande de financement', 'Les champs sont enregistrés en brouillon à chaque étape.', '', `<div class="crumbs"><a href="#/dossiers">Dossiers</a>${icon('chevron')}<span>Nouvelle demande</span></div>`)}
    <div class="card"><div class="stepper">${labels.map((l, i) => `<div class="step ${i < wizStep ? 'done' : i === wizStep ? 'active' : ''}"><div class="dotnum">${i < wizStep ? icon('check') : i + 1}</div>${l}</div>`).join('')}</div></div>
    <div class="card" style="display:grid;gap:20px">
      <h2>${labels[wizStep]}</h2>
      <div class="form-grid">${panes[wizStep]}</div>
      <div class="form-actions">
        <button class="btn btn-ghost" ${wizStep === 0 ? 'disabled style="opacity:.5;pointer-events:none"' : ''} onclick="wizStep--;render()">Précédent</button>
        ${wizStep < labels.length - 1
          ? `<button class="btn btn-primary" onclick="wizStep++;render()">Continuer ${icon('arrow', 'i-arrow')}</button>`
          : `<button class="btn btn-primary" onclick="submitDemande()">${icon('check')} Soumettre la demande</button>`}
      </div>
    </div>`;
}

function viewUsers() {
  return `
    ${pageHead('Utilisateurs & rôles', `Accès limité aux adresses @${ALLOWED_DOMAIN}.`, `<button class="btn btn-primary" onclick="toast('Invitation envoyée (démo)'); audit('Invitation utilisateur')">${icon('plus', 'i-plus')} Inviter</button>`)}
    <div class="table-wrap"><table>
      <thead><tr><th>Utilisateur</th><th>E-mail</th><th>Rôle</th><th>Statut</th><th>Dernière connexion</th></tr></thead>
      <tbody>${USERS.map(u => `<tr>
        <td><div class="who"><div class="avatar">${initials(u.nom)}</div><b>${esc(u.nom)}</b></div></td>
        <td class="muted">${u.email}${ALLOWED_DOMAIN}</td>
        <td>${ROLES[u.role].label}</td>
        <td>${u.actif ? '<span class="badge b-success">Actif</span>' : '<span class="badge b-neutral">Désactivé</span>'}</td>
        <td>${fDateTime(u.derniere)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="card">
      <div class="card-head"><h2>Matrice des droits</h2>${icon('lock')}</div>
      <div class="table-wrap"><table class="matrix">
        <thead><tr><th>Permission</th>${Object.values(ROLES).map(r => `<th>${r.label}</th>`).join('')}</tr></thead>
        <tbody>${Object.entries(PERM_LABELS).map(([p, l]) => `<tr><td>${l}</td>${Object.values(ROLES).map(r => `<td>${r.perms.includes(p) ? `<span class="check">${icon('check')}</span>` : '<span class="nope">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

function viewAudit() {
  return `
    ${pageHead("Journal d'audit", 'Toutes les actions sensibles sont horodatées et conservées.', `<button class="btn btn-ghost" onclick="toast('Export du journal généré (démo)')">${icon('download')} Exporter</button>`)}
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Heure</th><th>Utilisateur</th><th>Action</th><th>Cible</th><th>Adresse IP</th></tr></thead>
      <tbody>${AUDIT.map(a => `<tr>
        <td>${fDate(a.at)}</td><td>${fTime(a.at)}</td>
        <td>${esc(a.user)}</td>
        <td>${/refus/i.test(a.action) ? `<span class="badge b-danger">${esc(a.action)}</span>` : esc(a.action)}</td>
        <td><span class="ref">${esc(a.cible)}</span></td>
        <td class="ref">${a.ip}</td></tr>`).join('')}</tbody>
    </table></div>`;
}

function viewDenied() {
  audit('Accès refusé', location.hash);
  return `<div class="card denied"><div class="big">${icon('lock')}</div><h2>Accès non autorisé</h2><p class="muted" style="margin:0">Votre rôle (${ROLES[session.role].label}) ne permet pas d'accéder à cette page.</p><a class="btn btn-ghost" href="#/tableau-de-bord">Retour au tableau de bord</a></div>`;
}

/* =========================================================
   Actions
   ========================================================= */
function toast(msg) {
  const t = $('#toast');
  t.querySelector('span').textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}

function decision(ref, verdict) {
  const d = DOSSIERS.find(x => x.ref === ref);
  if (verdict === 'rejete') { d.statut = 'rejete'; }
  else { d.etape = Math.min(d.etape + 1, 4); d.statut = d.etape >= 4 ? 'approuve' : d.etape === 3 ? 'comite' : 'analyse'; }
  d.date = new Date().toISOString();
  audit(verdict === 'rejete' ? 'Dossier rejeté' : 'Étape validée', ref);
  toast(verdict === 'rejete' ? 'Dossier rejeté' : 'Étape validée');
  render();
}

function submitDemande() {
  wizStep = 0;
  audit('Demande créée', 'FE-2026-0143');
  toast('Demande FE-2026-0143 soumise');
  location.hash = '#/dossiers';
}
</script>
</body>
</html>
