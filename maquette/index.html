<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette Fin'Elle</title>
<style>
/* =========================================================
   Charte – valeurs indicatives, à remplacer par la charte
   officielle Fin'Elle / Cofina (seules ces variables changent).
   ========================================================= */
:root {
  --accent: #D6336C;
  --accent-hover: #BE2A5E;
  --accent-soft: #FCE8EF;
  --accent-ring: rgba(214, 51, 108, .28);

  --bg: #FFFFFF;
  --surface: #F5F6F8;
  --surface-2: #ECEEF1;
  --border: #E1E4E8;
  --text: #2F3437;
  --text-muted: #6B7178;

  --success: #2F9E62;  --success-soft: #E6F4EC;
  --warning: #C77700;  --warning-soft: #FFF3DF;
  --danger:  #C92A2A;  --danger-soft:  #FDE8E8;
  --info:    #2C6DB5;  --info-soft:    #E7F0FA;

  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow: 0 2px 8px rgba(16, 24, 40, .07);
  --shadow-hover: 0 8px 20px rgba(16, 24, 40, .10);

  --ease: cubic-bezier(.2, .7, .3, 1);
  --t-fast: 140ms;
  --t: 200ms;

  --sidebar-w: 248px;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: 22px; }
h2 { font-size: 16px; }
h3 { font-size: 14px; }
.muted { color: var(--text-muted); }
.hidden { display: none !important; }
svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease), color var(--t) var(--ease), border-color var(--t) var(--ease);
}
.btn:focus-visible, .input:focus-visible, .nav-item:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 6px 14px var(--accent-ring); }
.btn-primary:active { transform: translateY(0); box-shadow: var(--shadow-sm); }
.btn-ghost { background: var(--bg); color: var(--text); border-color: var(--border); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.btn-ghost:active { transform: translateY(0); }
.btn .i { transition: transform var(--t) var(--ease); }
.btn:hover .i-arrow { transform: translateX(3px); }
.btn:hover .i-plus { transform: rotate(90deg); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center;
  border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; color: var(--text-muted); cursor: pointer;
  transition: background var(--t) var(--ease), color var(--t) var(--ease);
}
.icon-btn:hover { background: var(--surface); color: var(--accent); }

/* ---------- Champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 13px; }
.input, select.input, textarea.input {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.input:hover { border-color: #C5CAD1; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.field-error { color: var(--danger); font-size: 12.5px; min-height: 18px; }
.input.invalid { border-color: var(--danger); }

/* ---------- Badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-accent  { background: var(--accent-soft);  color: var(--accent); }
.b-success { background: var(--success-soft); color: var(--success); }
.b-warning { background: var(--warning-soft); color: var(--warning); }
.b-danger  { background: var(--danger-soft);  color: var(--danger); }
.b-info    { background: var(--info-soft);    color: var(--info); }
.b-neutral { background: var(--surface-2);    color: var(--text-muted); }

/* ---------- Cartes ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow-sm);
  transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease), border-color var(--t) var(--ease);
}
.card-hover:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: #D3D7DD; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }

/* ---------- Connexion ---------- */
.login {
  min-height: 100%; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(1000px 500px at 85% -10%, var(--accent-soft), transparent 60%), var(--bg);
}
.login-card { width: 100%; max-width: 420px; background: var(--bg); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); animation: rise .45s var(--ease) both; }
.login-card form { display: grid; gap: 12px; margin-top: 24px; }
.login-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start; }
.login-foot .i { width: 16px; height: 16px; color: var(--accent); margin-top: 2px; }

/* ---------- Logo ---------- */
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 15px;
  transition: transform var(--t) var(--ease);
}
.logo:hover .logo-mark { transform: rotate(-6deg) scale(1.05); }
.logo small { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: .02em; }

/* ---------- Layout appli ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100%; }
.sidebar {
  position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--border); background: var(--bg);
  display: flex; flex-direction: column; padding: 18px 14px; gap: 22px; z-index: 30;
}
.nav { display: grid; gap: 2px; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); padding: 10px 12px 6px; font-weight: 600; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 12px;
  border-radius: var(--radius-sm); color: var(--text); font-weight: 500;
  transition: background var(--t) var(--ease), color var(--t) var(--ease);
}
.nav-item::before {
  content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0;
  background: var(--accent); transform: scaleY(0); transition: transform var(--t) var(--ease);
}
.nav-item .i { color: var(--text-muted); transition: transform var(--t) var(--ease), color var(--t) var(--ease); }
.nav-item:hover { background: var(--surface); }
.nav-item:hover .i { transform: translateX(2px); color: var(--accent); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item.active .i { color: var(--accent); }
.nav-item.active::before { transform: scaleY(1); }
.nav-item .count { margin-left: auto; font-size: 11.5px; background: var(--accent); color: #fff; padding: 1px 7px; border-radius: 999px; font-weight: 600; }
.sidebar-foot { margin-top: auto; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12.5px;
}
.user-chip .meta { min-width: 0; flex: 1; }
.user-chip .meta b, .user-chip .meta span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-chip .meta span { font-size: 12px; color: var(--text-muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 12px 28px; background: rgba(255, 255, 255, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
.topbar .search { position: relative; flex: 1; max-width: 420px; }
.topbar .search .i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 16px; height: 16px; }
.topbar .search .input { padding-left: 34px; background: var(--surface); border-color: transparent; }
.topbar .search .input:focus { background: var(--bg); }
.topbar .spacer { flex: 1; }
.notif { position: relative; }
.notif .dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
.notif:hover .i { animation: ring .5s var(--ease); }
.menu-toggle { display: none; }

.content { padding: 28px; display: grid; gap: 24px; max-width: 1280px; width: 100%; animation: fade .3s var(--ease) both; }
.content > * { min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { margin: 4px 0 0; }
.crumbs { font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
.crumbs a { color: var(--text-muted); transition: color var(--t) var(--ease); }
.crumbs a:hover { color: var(--accent); }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { display: grid; gap: 6px; }
.kpi .kpi-top { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 13px; font-weight: 500; }
.kpi .kpi-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); color: var(--accent); border: 1px solid var(--border); transition: transform var(--t) var(--ease), background var(--t) var(--ease), color var(--t) var(--ease); }
.kpi:hover .kpi-ico { transform: scale(1.08); background: var(--accent); color: #fff; border-color: var(--accent); }
.kpi .kpi-val { font-size: 24px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.kpi .kpi-delta { font-size: 12.5px; }
.up { color: var(--success); } .down { color: var(--danger); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
.grid-2-even { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-2 > *, .grid-2-even > *, .kpis > * { min-width: 0; }

/* ---------- Tableaux ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); -webkit-overflow-scrolling: touch; }
.card .table-wrap { margin: 0 -1px -1px; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th, td { text-align: left; padding: 12px 16px; white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; background: var(--surface); border-bottom: 1px solid var(--border); }
td { border-bottom: 1px solid var(--border); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background var(--t-fast) var(--ease); }
tbody tr.clickable { cursor: pointer; }
tbody tr:hover { background: #FAFBFC; }
tbody tr.clickable td:first-child { box-shadow: inset 0 0 0 var(--accent); transition: box-shadow var(--t) var(--ease); }
tbody tr.clickable:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tbody tr .row-go { opacity: 0; transform: translateX(-4px); transition: opacity var(--t) var(--ease), transform var(--t) var(--ease); color: var(--accent); }
tbody tr:hover .row-go { opacity: 1; transform: translateX(0); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.ref { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; color: var(--text-muted); }
.who { display: flex; align-items: center; gap: 10px; }
.who .avatar { width: 30px; height: 30px; font-size: 11.5px; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .input { width: auto; min-width: 180px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font: inherit; font-size: 13px; color: var(--text);
  transition: border-color var(--t) var(--ease), color var(--t) var(--ease), background var(--t) var(--ease);
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- Étapes ---------- */
.stepper { display: flex; gap: 0; counter-reset: s; overflow-x: auto; padding-bottom: 4px; }
.step { flex: 1; min-width: 120px; position: relative; display: grid; justify-items: center; gap: 8px; text-align: center; font-size: 12.5px; color: var(--text-muted); }
.step::after { content: ""; position: absolute; top: 15px; left: calc(50% + 20px); right: calc(-50% + 20px); height: 2px; background: var(--border); border-radius: 2px; }
.step:last-child::after { display: none; }
.step.done::after { background: var(--accent); }
.step .dotnum {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: var(--bg); border: 2px solid var(--border); color: var(--text-muted); position: relative; z-index: 1;
  transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.step:hover .dotnum { transform: scale(1.08); }
.step.done .dotnum { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.active { color: var(--text); font-weight: 600; }
.step.active .dotnum { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); animation: pulse 2.4s var(--ease) infinite; }
.step .dotnum .i { width: 15px; height: 15px; stroke-width: 2.5; }

/* ---------- Divers ---------- */
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.kv div span { display: block; font-size: 12px; color: var(--text-muted); }
.kv div b { font-weight: 600; }
.list { display: grid; gap: 4px; }
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-sm);
  transition: background var(--t) var(--ease);
}
.list-item:hover { background: var(--bg); }
.list-item .doc-ico { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted); transition: color var(--t) var(--ease), border-color var(--t) var(--ease); }
.list-item:hover .doc-ico { color: var(--accent); border-color: var(--accent); }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .grow b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .grow span { font-size: 12px; color: var(--text-muted); }

.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 18px 1fr; gap: 12px; position: relative; padding-bottom: 16px; }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--border); }
.tl:last-child::before { display: none; }
.tl .pt { width: 12px; height: 12px; margin: 4px 3px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); transition: transform var(--t) var(--ease), background var(--t) var(--ease); }
.tl:hover .pt { transform: scale(1.25); background: var(--accent); }
.tl small { color: var(--text-muted); display: block; }

.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
.bar-row .bar-track { grid-column: 1 / -1; }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transform-origin: left; animation: grow .8s var(--ease) both; transition: filter var(--t) var(--ease); }
.bar-row:hover .bar-fill { filter: brightness(1.12); }
.bar-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); }

.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.check { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.check .i { width: 14px; height: 14px; stroke-width: 2.6; }
.nope { color: #C5CAD1; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.upload {
  border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 22px; text-align: center; background: var(--bg); color: var(--text-muted); cursor: pointer;
  transition: border-color var(--t) var(--ease), background var(--t) var(--ease), color var(--t) var(--ease);
}
.upload:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.upload .i { width: 26px; height: 26px; margin-bottom: 6px; transition: transform var(--t) var(--ease); }
.upload:hover .i { transform: translateY(-3px); }
.form-actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.denied { text-align: center; padding: 56px 20px; display: grid; gap: 10px; justify-items: center; }
.denied .big { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.denied .big .i { width: 26px; height: 26px; }

.toast {
  position: fixed; right: 20px; bottom: 20px; z-index: 100; display: flex; gap: 10px; align-items: center;
  background: var(--text); color: #fff; padding: 12px 16px; border-radius: var(--radius); box-shadow: var(--shadow-hover);
  transform: translateY(16px); opacity: 0; pointer-events: none; transition: transform var(--t) var(--ease), opacity var(--t) var(--ease);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast .i { color: #7BE0A6; }

.demo-banner { background: var(--accent-soft); color: var(--accent); font-size: 12.5px; text-align: center; padding: 6px 12px; font-weight: 600; }
.backdrop { display: none; }

/* ---------- Animations ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 5px var(--accent-soft); } 50% { box-shadow: 0 0 0 8px rgba(252, 232, 239, .55); } }
@keyframes ring { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(12deg); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(5deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- Responsive : ordinateur d'abord ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; transform: translateX(-100%); transition: transform var(--t) var(--ease); box-shadow: var(--shadow-hover); }
  .app.nav-open .sidebar { transform: none; }
  .app.nav-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(16, 24, 40, .35); z-index: 25; animation: fade .2s both; }
  .menu-toggle { display: inline-grid; }
  .topbar { padding: 10px 16px; }
  .content { padding: 20px 16px; }
  .grid-2-even, .form-grid, .kv { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: 1fr; }
  .topbar .search { display: none; }
  .toolbar .input { min-width: 0; flex: 1; }
  .hide-sm { display: none; }
}

/* ---------- Fiche d'engagement de dépenses ---------- */
.fiche { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.fiche-head { display: flex; align-items: center; gap: 16px; padding: 18px 24px 14px; border-bottom: 3px solid var(--accent); }
.fiche-code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; font-style: italic; color: var(--text-muted); }

.fiche-grid { display: grid; grid-template-columns: 1fr 1fr; }

.fiche-signs { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--text); }

.fiche-sign + .fiche-sign { border-left: 2px solid var(--text); }
.fiche-sign h3 { text-align: center; font-size: 13px; }
.sign-box {
  height: 120px; border-radius: var(--radius-sm); border: 1px dashed var(--border); background: var(--surface);

}
.sign-box img { max-height: 90px; max-width: 100%; }
.sign-meta { font-size: 12px; color: var(--text-muted); text-align: center; }
.radio-row { display: flex; gap: 18px; align-items: center; padding-top: 2px; }
.radio-row label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-weight: 500; }
.radio-row input { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

/* Pad de signature */
.pad-wrap { position: relative; }
.pad { width: 100%; height: 140px; display: block; border-radius: var(--radius-sm); border: 1.5px dashed var(--border); background: var(--bg); cursor: crosshair; touch-action: none; transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease); }
.pad:hover { border-color: var(--accent); }
.pad.signed { border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pad.invalid { border-color: var(--danger); }
.pad-hint { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--text-muted); font-size: 12.5px; transition: opacity var(--t) var(--ease); }
.pad.signed + .pad-hint { opacity: 0; }
.pad-actions { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; font-weight: 600; }
.link-btn:hover { text-decoration: underline; }

/* Bandeaux */
.alert { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--radius); border: 1px solid; align-items: flex-start; }
.alert .i { margin-top: 2px; }

.alert-danger { background: var(--danger-soft); border-color: #F5C2C2; color: var(--danger); }

.alert-warning { background: var(--warning-soft); border-color: #F3D9A8; color: var(--warning); }
.alert-warning p { color: var(--text); }
.alert-success { background: var(--success-soft); border-color: #BFE3CD; color: var(--success); }
.alert-success p { color: var(--text); }
.alert .btn { margin-top: 10px; }

.modal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(16, 24, 40, .4); display: grid; place-items: center; padding: 16px; animation: fade .2s var(--ease) both; }
.modal { width: 100%; max-width: 520px; background: var(--bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-hover); padding: 24px; display: grid; gap: 16px; animation: rise .25s var(--ease) both; max-height: calc(100% - 32px); overflow: auto; }

.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #27865A; transform: translateY(-1px); box-shadow: 0 6px 14px rgba(47, 158, 98, .25); }

/* Notifications */
.notif-panel {
  position: absolute; right: 16px; top: calc(100% + 6px); width: 360px; max-width: calc(100vw - 32px); z-index: 40;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-hover); overflow: hidden; animation: rise .2s var(--ease) both;

.notif-item small { color: var(--text-muted); }
.notif-empty { padding: 20px 16px; color: var(--text-muted); text-align: center; }
.notif .count-dot { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }

// Montant en lettres (règles françaises : vingt/cent au pluriel, mille invariable)
function enLettres(n) {
  const u = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
  const t = ['', 'dix', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante', 'quatre-vingt', 'quatre-vingt'];
  const sous100 = n => {
    if (n < 20) return u[n];
    const d = Math.floor(n / 10), r = n % 10;
    if (d === 7 || d === 9) return t[d] + (d === 7 && r === 1 ? ' et ' : '-') + u[10 + r];
    if (r === 0) return d === 8 ? 'quatre-vingts' : t[d];
    if (r === 1 && d !== 8) return t[d] + ' et un';
    return t[d] + '-' + u[r];
  };
  const sous1000 = (n, final) => {
    const c = Math.floor(n / 100), r = n % 100;
    let w = c ? (c === 1 ? 'cent' : u[c] + ' cent' + (r === 0 && final ? 's' : '')) : '';
    if (r) { let x = sous100(r); if (!final && x === 'quatre-vingts') x = 'quatre-vingt'; w += (w ? ' ' : '') + x; }
    return w;
  };
  n = Math.floor(n);
  if (!n) return '';
  const mrd = Math.floor(n / 1e9), mil = Math.floor(n / 1e6) % 1000, k = Math.floor(n / 1000) % 1000, r = n % 1000;
  const parts = [];
  if (mrd) parts.push(sous1000(mrd, true) + ' milliard' + (mrd > 1 ? 's' : ''));
  if (mil) parts.push(sous1000(mil, true) + ' million' + (mil > 1 ? 's' : ''));
  if (k) parts.push(k === 1 ? 'mille' : sous1000(k, false) + ' mille');
  if (r) parts.push(sous1000(r, true));
  const s = parts.join(' ') + (!k && !r ? ' de' : '') + ' francs CFA';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function sigFromName(id) {

}

/* Pad de signature (souris, stylet ou doigt) */
function initPad(canvas) {
  const ratio = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * ratio; canvas.height = r.height * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#2F3437';
  let drawing = false, last = null;
  canvas.isEmpty = true;
  const pos = e => { const b = canvas.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
    if (canvas.isEmpty) { canvas.isEmpty = false; canvas.classList.add('signed'); canvas.classList.remove('invalid'); }
  });
  const stop = () => { drawing = false; };
  canvas.addEventListener('pointerup', stop); canvas.addEventListener('pointercancel', stop);
  canvas.clear = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.isEmpty = true; canvas.classList.remove('signed'); };
  return canvas;
}

  if (sig) return `<div class="sign-box"><img src="${sig.img || sigFromName(sig.by)}" alt="Signature de ${esc(nom(sig.by))}"></div>

  return `<div class="sign-box">${waitingFor}</div><div class="sign-meta">&nbsp;</div>`;
}

/* La fiche, au format du formulaire papier 05SUP02V03 */

    <div class="fiche">

        <div class="fiche-cell"><span>Objet</span><b>${esc(d.objet)}</b></div>
        <div class="fiche-cell"><span>Demandeur</span><b>${esc(u.nom)}</b></div>
        <div class="fiche-cell"><span>Service</span><b>${esc(u.service)}</b></div>
        <div class="fiche-cell"><span>Fonction</span><b>${esc(u.fonction)}</b></div>

/* Bloc « Validation (2) de la demande par CFO » */
function cfoSection(d) {
  const cfo = userById(CFO_ID);

  if (!editable && !d.cfo && d.statut !== 'cfo') return '';
  const head = `<div class="fiche-section" style="border-top:2px solid var(--text)">Validation (2) de la demande par CFO</div>`;
  const ident = `
    <div class="fiche-cell"><span>Fonction</span><b>${esc(cfo.fonction.toUpperCase())}</b></div>
    <div class="fiche-cell"><span>Nom-Prénom</span><b>${esc(cfo.nom.toUpperCase())}</b></div>`;
  const pfLabel = i => { const p = d.raf.proformas[i]; return `Proforma ${i + 1} – ${p.fournisseur}${p.ref ? ` (Réf. ${p.ref})` : ''}`; };
  if (!editable && !d.cfo) return `${head}<div class="fiche-grid">${ident}</div>
    <div class="fiche-signs single"><div class="fiche-sign"><h3>Signature</h3>${signatureBlock(null, `${icon('clock')}&nbsp;En attente de ${esc(cfo.nom)} (CFO)`)}</div></div>`;
  if (!editable) {
    const c = d.cfo;
    return `${head}<div class="fiche-grid">${ident}
      <div class="fiche-cell full"><span>Proforma retenue</span><b>${esc(pfLabel(c.proforma))}</b></div>
      <div class="fiche-cell full"><span>Montant en chiffre</span><b>${fcfa(c.montant)}</b></div>
      <div class="fiche-cell full"><span>Montant en lettre</span><b>${esc(c.lettres)}</b></div>
      <div class="fiche-cell full"><span>Réserve</span><b style="font-weight:500">${esc(c.reserve) || '—'}</b></div>
      <div class="fiche-cell full"><span>Date</span><b>${fDate(c.date)}</b></div>
    </div>
    <div class="fiche-signs single"><div class="fiche-sign"><h3>Signature</h3>${signatureBlock(d.sigCfo, '')}</div></div>`;
  }

  return `${head}<div class="fiche-grid" id="cfoForm">${ident}

        <select class="input" id="cfoPf" onchange="cfoPickProforma(this)"><option value="">Choisir parmi les proformas du RAF/HF…</option>${options}</select>
        <div class="field-error" id="eCfoPf"></div></div>
      <div class="fiche-cell full"><label for="cfoMontant">Montant en chiffre (FCFA) *</label>
        <input class="input" id="cfoMontant" inputmode="numeric" placeholder="0" oninput="this.value=this.value.replace(/[^0-9]/g,'').replace(/\\B(?=(\\d{3})+(?!\\d))/g,' ');cfoMontantChange()">
        <div class="field-error" id="eCfoM"></div></div>
      <div class="fiche-cell full"><label for="cfoLettres">Montant en lettre *</label>
        <textarea class="input" id="cfoLettres" rows="2" placeholder="Rempli automatiquement à partir du montant en chiffre"></textarea>
        <div class="field-error" id="eCfoL"></div></div>
      <div class="fiche-cell full"><label for="cfoReserve">Réserve</label><textarea class="input" id="cfoReserve" rows="2" placeholder="Observations éventuelles (facultatif)"></textarea></div>
      <div class="fiche-cell full"><span>Date</span><b>${fDate(new Date())}</b></div>
    </div>
    <div class="fiche-signs single"><div class="fiche-sign"><h3>Signature *</h3>${padHtml('padCfo', 'Signez ici pour valider')}<div class="field-error" id="eSigC"></div>
      <div class="form-actions" style="margin-top:6px">
        <button class="btn btn-ghost" onclick="openReturnCfo('${d.ref}')">${icon('arrow', 'i-back')} Retourner au RAF/HF</button>

}

/* Bloc « Validation (1) de la demande par RAF/HF » : formulaire pour le RAF/HF, lecture seule pour les autres */

  if (!editable && !d.raf && d.statut !== 'raf') return '';
  const head = `<div class="fiche-section" style="border-top:2px solid var(--text)">Validation (1) de la demande par RAF/HF</div>`;

    <div class="fiche-cell"><span>Fonction</span><b>${esc(raf.fonction.toUpperCase())}</b></div>
    <div class="fiche-cell"><span>Nom-Prénom</span><b>${esc(raf.nom.toUpperCase())}</b></div>`;
  if (!editable && !d.raf) return `${head}<div class="fiche-grid">${ident}</div>
    <div class="fiche-signs single"><div class="fiche-sign"><h3>Signature</h3>${signatureBlock(null, `${icon('clock')}&nbsp;En attente de ${esc(raf.nom)} (RAF/HF)`)}</div></div>`;
  if (!editable) {
    const r = d.raf;
    return `${head}<div class="fiche-grid">${ident}
      <div class="fiche-cell full"><span>Montant achat</span><div class="tranches">${TRANCHES.map((t, i) => `<span class="tranche ${i === r.tranche ? 'on' : ''}">${i === r.tranche ? icon('check') : ''}${t}</span>`).join('')}</div></div>
      ${r.proformas.map((p, i) => `<div class="fiche-cell full"><div class="pf-row"><div><span>Proforma ${i + 1}</span><b>${esc(p.fournisseur) || '—'}</b></div><div><span>Réf N°</span><b>${esc(p.ref) || '—'}</b></div><div><span>Montant</span><b>${p.montant ? fcfa(p.montant) : '— FCFA'}</b></div></div></div>`).join('')}
      <div class="fiche-cell full"><span>Réserve</span><b style="font-weight:500">${esc(r.reserve) || '—'}</b></div>

      <div class="fiche-cell full"><span>Montant achat *</span>
        <div class="tranches">${TRANCHES.map((l, i) => `<label class="tranche"><input type="radio" name="tranche" value="${i}" ${d.raf?.tranche === i ? 'checked' : ''}>${l}</label>`).join('')}</div>
        <div class="field-error" id="eTranche"></div></div>
      ${[0, 1, 2].map(i => `<div class="fiche-cell full"><div class="pf-row">
        <div><label for="pfF${i}">Proforma ${i + 1}${i === 0 ? ' *' : ''}</label><input class="input" id="pfF${i}" placeholder="Fournisseur" value="${esc(d.raf?.proformas[i].fournisseur)}"></div>

      </div>${i === 0 ? '<div class="field-error" id="ePf"></div>' : ''}</div>`).join('')}
      <div class="fiche-cell full"><label for="rafReserve">Réserve</label><textarea class="input" id="rafReserve" rows="2" placeholder="Observations éventuelles (facultatif)">${esc(d.raf?.reserve)}</textarea></div>
      <div class="fiche-cell full"><span>Date</span><b>${fDate(new Date())}</b></div>
    </div>
    <div class="fiche-signs single"><div class="fiche-sign"><h3>Signature *</h3>${padHtml('padRaf', 'Signez ici pour valider')}<div class="field-error" id="eSigR"></div>
      <div class="form-actions" style="margin-top:6px">
        <button class="btn btn-ghost" onclick="openReturn('${d.ref}')">${icon('arrow', 'i-back')} Retourner au N+1</button>
        <button class="btn btn-success" onclick="submitRaf('${d.ref}')">${icon('check')} Valider et signer</button>
      </div></div></div>`;
}

function viewDashboard() {
  const list = visible();
  const mine = list.filter(d => d.demandeur === session.id);
  const todo = aValider();
  const sum = arr => arr.reduce((s, d) => s + d.montant, 0);
  const kpi = (label, val, ic, sub, href) => `
    <a class="card card-hover kpi" href="${href}" style="color:inherit">
      <div class="kpi-top">${label}<span class="kpi-ico">${icon(ic)}</span></div>
      <div class="kpi-val">${val}</div>
      <div class="kpi-delta muted">${sub}</div>
    </a>`;
  const isN1 = can(['valider', 'raf', 'cfo']);
  const counts = Object.keys(STATUS).filter(s => s !== 'brouillon').map(s => [s, list.filter(d => d.statut === s).length]);
  const max = Math.max(1, ...counts.map(c => c[1]));
  return `
    ${pageHead(`Bonjour, ${esc(session.name.split(' ')[0])}`, `${ROLES[session.role].label} · situation au ${fDate(new Date())} à ${fTime(new Date())}.`,

    ${isN1 && todo.length ? `<div class="alert alert-warning">${icon('inbox')}<div><b>${todo.length} demande${todo.length > 1 ? 's' : ''} en attente de votre signature</b><p>${session.role === 'raf' ? 'Fiches validées par les N+1, en attente de votre validation.' : session.role === 'cfo' ? 'Fiches validées par le RAF/HF, en attente de votre validation.' : 'Vos collaborateurs attendent votre validation.'}</p><a class="btn btn-ghost btn-sm" href="#/a-valider">Voir les demandes ${icon('arrow', 'i-arrow')}</a></div></div>` : ''}
    <div class="kpis">
      ${isN1 ? kpi('À valider', todo.length, 'inbox', fcfa(sum(todo)), '#/a-valider') : kpi('Mes demandes en cours', mine.filter(d => ['attente', 'raf', 'cfo'].includes(d.statut)).length, 'clock', 'dans le circuit de validation', '#/demandes')}
      ${kpi('Validées', list.filter(d => d.statut === 'validee').length, 'check', fcfa(sum(list.filter(d => d.statut === 'validee'))) + ' engagés', '#/demandes')}
      ${kpi('Rejetées', list.filter(d => d.statut === 'rejetee').length, 'message', 'avec commentaire', '#/demandes')}
      ${kpi('Montant total demandé', fcfa(sum(list)), 'wallet', `${list.length} demandes`, '#/demandes')}
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-head"><h2>${isN1 ? 'Dernières demandes' : 'Mes dernières demandes'}</h2><a class="btn btn-ghost btn-sm" href="#/demandes">Tout voir ${icon('arrow', 'i-arrow')}</a></div>
        ${demandeTable((isN1 ? list : mine).slice(0, 5), "Vous n'avez pas encore de demande.")}
      </div>
      <div class="card">
        <div class="card-head"><h2>Par statut</h2></div>
        <div class="bars">
          ${counts.map(([s, n], i) => `
            <div class="bar-row"><span>${STATUS[s][0]}</span><span class="num">${n}</span><div class="bar-track"><div class="bar-fill" style="width:${(n / max * 100).toFixed(1)}%;animation-delay:${i * 60}ms"></div></div></div>`).join('')}
        </div>
        <div class="list" style="margin-top:18px">
          <h3 style="margin-bottom:4px">Circuit de validation</h3>
          ${[['pen', 'Le demandeur remplit et signe la fiche'], ['inbox', 'Le N+1 valide en signant, ou rejette avec un commentaire'], ['shield', 'Le RAF/HF complète sa partie et signe, ou retourne la fiche au N+1'], ['wallet', 'Le CFO retient la proforma, fixe le montant et signe'], ['check', 'La demande est validée']].map(([ic, t]) => `<div class="list-item"><div class="doc-ico">${icon(ic)}</div><div class="grow"><span style="font-size:13px;color:var(--text)">${t}</span></div></div>`).join('')}
        </div>
      </div>
    </div>`;
}

  let list = visible();
  if (filtre !== 'toutes') list = list.filter(d => d.statut === filtre);
  if (recherche) { const q = recherche.toLowerCase(); list = list.filter(d => [d.ref, d.objet, nom(d.demandeur)].some(v => v.toLowerCase().includes(q))); }
  const scope = session.role === 'admin' ? 'Toutes les demandes' : session.role === 'raf' ? 'Demandes transmises au RAF/HF' : session.role === 'cfo' ? 'Demandes transmises au CFO' : can('valider') ? 'Vos demandes et celles de votre équipe' : 'Vos demandes';
  return `
    ${pageHead("Fiches d'engagement de dépenses", `${scope} · ${visible().length} au total`,
      `<button class="btn btn-ghost" onclick="toast('Export généré (démo)'); audit('Export', 'Liste des demandes')">${icon('download')} Exporter</button>
       <a class="btn btn-primary" href="#/nouvelle-demande">${icon('plus', 'i-plus')} Nouvelle demande</a>`)}
    <div class="toolbar" style="justify-content:space-between">
      <div class="chips">${filters.map(([k, l]) => `<button class="chip ${filtre === k ? 'on' : ''}" onclick="filtre='${k}';render()">${l}</button>`).join('')}</div>
      ${recherche ? `<span class="chip on" onclick="recherche='';$('#search').value='';render()">« ${esc(recherche)} » ${icon('x')}</span>` : ''}
    </div>
    ${demandeTable(list, 'Aucune demande pour ce filtre.')}`;
}

function viewAValider() {
  const list = aValider();
  return `
    ${pageHead('À valider', session.role === 'raf' ? 'Fiches validées par les N+1, en attente de votre validation.' : session.role === 'cfo' ? 'Fiches validées par le RAF/HF, en attente de votre validation.' : 'Demandes de vos collaborateurs en attente de votre signature.')}
    ${demandeTable(list, `${icon('check')} Vous êtes à jour : aucune demande en attente.`)}`;

function viewDemande(ref) {
  const d = DEMANDES.find(x => x.ref === ref);
  if (!d || !visible().includes(d)) return pageHead('Demande introuvable', "Cette demande n'existe pas ou ne vous est pas accessible.", `<a class="btn btn-ghost" href="#/demandes">Retour</a>`);
  audit('Consultation', d.ref);
  NOTIFS.filter(x => x.to === session.id && x.ref === ref).forEach(x => x.lu = true);
  const isN1 = d.n1 === session.id && d.statut === 'attente';
  const isOwner = d.demandeur === session.id;
  const isRaf = session.id === RAF_ID && d.statut === 'raf';
  const isCfo = session.id === CFO_ID && d.statut === 'cfo';
  if (isCfo) afterRender = () => {
    initPad($('#padCfo')).addEventListener('pointerdown', () => { $('#eSigC').textContent = ''; });
    $('#cfoForm').addEventListener('input', e => {
      e.target.classList.remove('invalid');
      const err = e.target.closest('.fiche-cell')?.querySelector('.field-error'); if (err) err.textContent = '';
    });
  };
  if (isRaf) afterRender = () => {
    initPad($('#padRaf')).addEventListener('pointerdown', () => { $('#eSigR').textContent = ''; });
    $('#rafForm').addEventListener('input', e => {
      e.target.classList.remove('invalid');
      if (e.target.name === 'tranche') $('#eTranche').textContent = '';
      if (/^pf.0$/.test(e.target.id)) $('#ePf').textContent = '';
    });
  };
  const actions = isCfo ? `
    <button class="btn btn-ghost" onclick="openReturnCfo('${d.ref}')">${icon('arrow', 'i-back')} Retourner au RAF/HF</button>
    <button class="btn btn-primary" onclick="document.getElementById('cfoForm').scrollIntoView({behavior:'smooth'})">${icon('pen')} Compléter et signer</button>` : isRaf ? `
    <button class="btn btn-ghost" onclick="openReturn('${d.ref}')">${icon('arrow', 'i-back')} Retourner au N+1</button>
    <button class="btn btn-primary" onclick="document.getElementById('rafForm').scrollIntoView({behavior:'smooth'})">${icon('pen')} Compléter et signer</button>` : isN1 ? `
    <button class="btn btn-ghost" onclick="openReject('${d.ref}')">${icon('x')} Rejeter</button>
    <button class="btn btn-primary" onclick="openValidate('${d.ref}')">${icon('pen')} Valider et signer</button>` : '';
  let banner = '';
  if (d.statut === 'rejetee') banner = `<div class="alert alert-danger">${icon('message')}<div><b>Demande rejetée par ${esc(nom(d.n1))}</b><p>« ${esc(d.commentaire)} »</p>${isOwner ? `<a class="btn btn-ghost btn-sm" href="#/nouvelle-demande/${d.ref}">${icon('pen')} Corriger et renvoyer</a>` : ''}</div></div>`;
  else if (d.statut === 'validee') banner = `<div class="alert alert-success">${icon('check')}<div><b>Demande validée pour ${fcfa(d.cfo.montant)}</b><p>Signée par ${esc(nom(d.n1))} (N+1), ${esc(nom(RAF_ID))} (RAF/HF) puis ${esc(nom(CFO_ID))} (CFO) le ${fDate(d.sigCfo.at)} à ${fTime(d.sigCfo.at)}.</p></div></div>`;
  else if (isCfo) banner = `<div class="alert alert-warning">${icon('inbox')}<div><b>Cette demande attend votre validation (2)</b><p>Les parties précédentes sont en lecture seule. Choisissez la proforma retenue, confirmez le montant et signez en bas de la fiche, ou retournez-la au RAF/HF.</p></div></div>`;
  else if (d.statut === 'cfo') banner = `<div class="alert alert-warning">${icon('clock')}<div><b>Validée par ${esc(nom(RAF_ID))} (RAF/HF)</b><p>En attente de la validation de ${esc(nom(CFO_ID))} (CFO).</p></div></div>`;
  else if (isRaf && d.retourCfo) banner = `<div class="alert alert-danger">${icon('message')}<div><b>Retournée par ${esc(nom(d.retourCfo.by))} (CFO) le ${fDate(d.retourCfo.at)} à ${fTime(d.retourCfo.at)}</b><p>« ${esc(d.retourCfo.comment)} »</p><p class="muted" style="font-size:12.5px">Votre partie est pré-remplie : corrigez-la et signez à nouveau, ou retournez la fiche au N+1.</p></div></div>`;
  else if (isRaf) banner = `<div class="alert alert-warning">${icon('inbox')}<div><b>Cette demande attend votre validation</b><p>Les parties Demandeur et Manager sont en lecture seule. Complétez votre partie en bas de la fiche et signez, ou retournez-la au N+1 si elle est mal remplie.</p></div></div>`;
  else if (d.statut === 'raf') banner = `<div class="alert alert-warning">${icon('clock')}<div><b>Validée par ${esc(nom(d.n1))} (N+1)</b><p>En attente de la validation de ${esc(nom(RAF_ID))} (RAF/HF).</p></div></div>`;
  else if (isN1 && d.retourRaf) banner = `<div class="alert alert-danger">${icon('message')}<div><b>Retournée par ${esc(nom(d.retourRaf.by))} (RAF/HF) le ${fDate(d.retourRaf.at)} à ${fTime(d.retourRaf.at)}</b><p>« ${esc(d.retourRaf.comment)} »</p><p class="muted" style="font-size:12.5px">Validez à nouveau si la fiche est correcte, ou rejetez-la vers ${esc(nom(d.demandeur))} pour correction.</p></div></div>`;
  else if (isN1) banner = `<div class="alert alert-warning">${icon('inbox')}<div><b>Cette demande attend votre décision</b><p>Validez-la en signant, ou rejetez-la avec un commentaire qui sera transmis à ${esc(nom(d.demandeur))}.</p></div></div>`;
  else if (d.statut === 'attente' && d.retourRaf) banner = `<div class="alert alert-warning">${icon('clock')}<div><b>Retournée au N+1 par le RAF/HF</b><p>« ${esc(d.retourRaf.comment)} »</p></div></div>`;
  else if (d.statut === 'attente') banner = `<div class="alert alert-warning">${icon('clock')}<div><b>En attente de validation</b><p>Transmise à ${esc(nom(d.n1))} (N+1) le ${fDate(d.date)} à ${fTime(d.date)}.</p></div></div>`;
  const step = { attente: 2, raf: 3, cfo: 4, validee: 5, rejetee: 3 }[d.statut];
  const steps = ['Fiche remplie', 'Signature demandeur', 'Validation N+1', 'Validation RAF/HF', 'Validation CFO'].map((s, i) => {
    const rejected = i === 2 && d.statut === 'rejetee';
    const state = i < step ? 'done' : i === step ? 'active' : '';
    return `<div class="step ${state}"><div class="dotnum">${state === 'done' ? icon(rejected ? 'x' : 'check') : i + 1}</div>${rejected ? 'Rejetée par le N+1' : s}</div>`;
  }).join('');
  return `
    ${pageHead(esc(d.objet), `${badge(d.statut)} <span class="ref" style="margin-left:8px">${d.ref}</span>`, actions, crumbs(d.ref))}
    ${banner}
    <div class="card"><div class="stepper">${steps}</div></div>
    <div class="grid-2">
      <div style="min-width:0">${ficheView(d)}</div>
      <div class="card">
        <div class="card-head"><h2>Historique</h2></div>
        <div class="timeline">
          ${[...d.historique].reverse().map(h => `
            <div class="tl"><div class="pt"></div><div><b>${esc(h.action)}</b><small>${esc(nom(h.by))} · ${fDateTime(h.at)}</small>${h.note ? `<p style="margin:6px 0 0;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--border);font-size:13px">« ${esc(h.note)} »</p>` : ''}</div></div>`).join('')}
        </div>
      </div>
    </div>`;
}

function toast(msg) {
  const t = $('#toast');
  t.querySelector('span').textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

function attachProforma(el, ref) {
  el.dataset.file = `Proforma_${ref}.pdf`;
  el.innerHTML = `${icon('file')}<div><b>Proforma_${ref}.pdf</b> · 312 Ko</div>`;
  toast('Pro-forma jointe (démo)');
}

function submitFiche(resubmitRef) {
  const objet = $('#fObjet').value.trim();
  const pf = document.querySelector('input[name=proforma]:checked');
  const montant = Number($('#fMontant').value.replace(/\D/g, ''));
  const sigPad = $('#padDemandeur');
  let ok = true;
  const setErr = (id, msg, el) => { $(id).textContent = msg; if (el) el.classList.toggle('invalid', !!msg); if (msg) ok = false; };
  setErr('#eObjet', objet.length < 5 ? "Décrivez l'objet de la dépense (5 caractères minimum)." : '', $('#fObjet'));
  setErr('#eProforma', pf ? '' : 'Indiquez si une pro-forma est jointe.');
  setErr('#eMontant', montant > 0 ? '' : 'Saisissez le montant estimé en FCFA.', $('#fMontant'));
  setErr('#eSig', sigPad.isEmpty ? 'Votre signature est obligatoire pour transmettre la fiche.' : '');
  if (sigPad.isEmpty) sigPad.classList.add('invalid');
  if (!ok) { toast('Complétez les champs signalés'); return; }

  const now = nowIso();
  const me = userById(session.id);
  const sig = { by: session.id, at: now, img: sigPad.toDataURL() };
  const pieces = pf.value === 'oui' ? [$('#pfUpload').dataset.file || `Proforma_${resubmitRef || 'jointe'}.pdf`] : [];
  let d;
  if (resubmitRef) {
    d = DEMANDES.find(x => x.ref === resubmitRef);
    Object.assign(d, { objet, proforma: pf.value === 'oui', montant, description: $('#fDesc').value.trim(), date: now, statut: 'attente', sigDemandeur: sig, sigManager: null, sigRaf: null, raf: null, retourRaf: null, sigCfo: null, cfo: null, retourCfo: null, commentaire: '', pieces });
    d.historique.push({ at: now, by: session.id, action: 'Fiche corrigée, signée et renvoyée au N+1' });
  } else {
    const ref = `FED-2026-${String(nextRef++).padStart(4, '0')}`;
    d = { ref, demandeur: session.id, n1: me.n1, objet, proforma: pf.value === 'oui', montant, description: $('#fDesc').value.trim(), date: now, statut: 'attente',
          sigDemandeur: sig, sigManager: null, sigRaf: null, raf: null, retourRaf: null, sigCfo: null, cfo: null, retourCfo: null, commentaire: '', pieces: pieces.map(p => p.replace('jointe', ref)), historique: [{ at: now, by: session.id, action: 'Fiche signée et transmise au N+1' }] };
    DEMANDES.unshift(d);
  }
  notify(d.n1, d.ref, `${me.nom} vous a transmis une demande à valider${resubmitRef ? ' (version corrigée)' : ''}.`);
  audit(resubmitRef ? 'Demande corrigée et renvoyée' : 'Demande signée et transmise', d.ref);
  toast(`Demande ${d.ref} transmise à ${nom(d.n1)}`);
  location.hash = '#/demande/' + d.ref;
}

function submitRaf(ref) {
  const d = DEMANDES.find(x => x.ref === ref);
  const tr = document.querySelector('input[name=tranche]:checked');
  const num = id => Number($(id).value.replace(/\D/g, ''));
  const proformas = [0, 1, 2].map(i => ({ fournisseur: $('#pfF' + i).value.trim(), ref: $('#pfR' + i).value.trim(), montant: num('#pfM' + i) }));
  const sigPad = $('#padRaf');
  let ok = true;
  $('#eTranche').textContent = tr ? '' : 'Cochez la tranche du montant d\'achat.'; if (!tr) ok = false;
  const p1 = proformas[0];
  const pfOk = p1.fournisseur && p1.ref && p1.montant > 0;
  $('#ePf').textContent = pfOk ? '' : 'Renseignez au moins la proforma 1 (fournisseur, référence et montant).'; if (!pfOk) ok = false;
  ['#pfF0', '#pfR0', '#pfM0'].forEach(id => $(id).classList.toggle('invalid', !pfOk && !$(id).value.trim()));
  $('#eSigR').textContent = sigPad.isEmpty ? 'Votre signature est obligatoire pour valider.' : ''; if (sigPad.isEmpty) { ok = false; sigPad.classList.add('invalid'); }
  if (!ok) { toast('Complétez les champs signalés'); return; }
  const now = nowIso();
  Object.assign(d, { statut: 'cfo', sigRaf: { by: session.id, at: now, img: sigPad.toDataURL() }, retourCfo: null,
    raf: { tranche: Number(tr.value), proformas, reserve: $('#rafReserve').value.trim(), date: now } });
  d.historique.push({ at: now, by: session.id, action: 'Validée et signée par le RAF/HF, transmise au CFO', note: d.raf.reserve ? `Réserve : ${d.raf.reserve}` : undefined });
  notify(d.demandeur, ref, `Votre demande a été validée par ${session.name} (RAF/HF) et transmise au CFO.`);
  notify(CFO_ID, ref, `${session.name} (RAF/HF) a validé une demande de ${nom(d.demandeur)} : elle attend votre validation.`);
  audit('Demande validée (RAF/HF)', ref);
  toast(`Demande ${ref} validée · transmise à ${nom(CFO_ID)} (CFO)`);
  render();
}

    <p class="muted" style="margin:0">${d.ref} · ${esc(d.objet)} · RAF/HF : <b style="color:var(--text)">${esc(nom(RAF_ID))}</b></p>
    <div class="field"><label for="retCfoCom">Ce qui doit être corrigé *</label><textarea class="input" id="retCfoCom" rows="4" placeholder="Ex. La proforma 2 n'est pas jointe au dossier."></textarea><div class="field-error" id="eRetCfo"></div></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-danger" onclick="confirmReturnCfo('${ref}')">${icon('arrow', 'i-back')} Retourner et notifier</button></div>`,
    () => $('#retCfoCom').focus());
}
function confirmReturnCfo(ref) {
  const com = $('#retCfoCom').value.trim();
  if (com.length < 10) { $('#eRetCfo').textContent = 'Le commentaire est obligatoire (10 caractères minimum).'; $('#retCfoCom').classList.add('invalid'); return; }
  const d = DEMANDES.find(x => x.ref === ref);
  const now = nowIso();
  Object.assign(d, { statut: 'raf', sigRaf: null, retourCfo: { by: session.id, at: now, comment: com } });
  d.historique.push({ at: now, by: session.id, action: 'Retournée au RAF/HF par le CFO', note: com });
  notify(RAF_ID, ref, `${session.name} (CFO) vous a retourné une demande : « ${com.length > 70 ? com.slice(0, 70) + '…' : com} »`);
  audit('Demande retournée au RAF/HF', ref);
  closeModal();
  toast(`Demande ${ref} retournée à ${nom(RAF_ID)}`);
  render();
}
</script>
</body>
</html>
